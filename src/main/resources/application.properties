spring.application.name=ProvaFinal
server.port=${SERVER_PORT:8080}
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:provafinal}
spring.datasource.username=${DB_USER:prova}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH0_ISSUER}
app.auth0.audience=${AUTH0_AUDIENCE}
app.auth0.roles-claim=${AUTH0_ROLES_CLAIM:https://social-insper.com/roles}
app.frontend-origins=${FRONTEND_ORIGINS:http://localhost:5173}
app.api.path=${API_RESOURCE_PATH:/registros}
app.security.read-roles=${API_READ_ROLES:ADMIN,USER}
app.security.write-roles=${API_WRITE_ROLES:ADMIN}

redis.host=${REDIS_HOST:localhost}
redis.port=${REDIS_PORT:6379}